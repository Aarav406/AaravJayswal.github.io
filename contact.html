<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Aarav Jayswal</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #ffffff; --text-main: #222222; --text-muted: #555555; --heading-color: #1a5276; --border-color: #dddddd; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
        a { text-decoration: none; color: inherit; }

        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background-color: white; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 1000; }
        .nav-logo { font-size: 1.2rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .nav-links { display: flex; gap: 15px; }
        .nav-links a { padding: 8px 16px; font-weight: 400; font-size: 0.95rem; border-radius: 3px; transition: 0.2s; }
        .nav-links a.active { background-color: var(--text-main); color: white; }
        .nav-links a:hover:not(.active) { background-color: #f0f0f0; }

        .contact-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; text-align: center; }
        .horizontal-title { font-size: 2.5rem; font-weight: 700; color: var(--heading-color); letter-spacing: 2px; margin-bottom: 20px; text-transform: uppercase; }
        .contact-info { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 40px; max-width: 600px; }
        
        .contact-links { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .btn-large { background-color: var(--text-main); color: white; padding: 15px 30px; border-radius: 6px; font-weight: 600; font-size: 1.1rem; transition: background-color 0.2s; }
        .btn-large:hover { background-color: var(--heading-color); }
        .btn-outline { border: 2px solid var(--text-main); color: var(--text-main); padding: 13px 30px; border-radius: 6px; font-weight: 600; font-size: 1.1rem; transition: 0.2s; }
        .btn-outline:hover { background-color: var(--text-main); color: white; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">Aarav Jayswal[cite: 2]</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="projects.html">Projects</a>
            <a href="resume.html">Resume</a>
            <a href="coursework.html">Coursework</a>
            <a href="contact.html" class="active">Contact</a>
        </div>
    </nav>

    <div class="contact-container">
        <h2 class="horizontal-title">Let's Connect</h2>
        <p class="contact-info">Whether you have a question regarding my projects, engineering coursework, or potential opportunities, I would love to hear from you.</p>
        
        <div class="contact-links">
            <a href="mailto:aaravjayswal115@gmail.com" class="btn-large">Email Me</a>
            <a href="https://www.linkedin.com/in/aaravjayswal" target="_blank" class="btn-outline">LinkedIn Profile</a>
        </div>
    </div>

</body>
</html>
