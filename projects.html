<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Aarav Jayswal</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #ffffff; --section-bg-gray: #f9f9f9; --text-main: #222222; --text-muted: #555555; --border-color: #dddddd; --heading-color: #1a5276; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; scroll-behavior: smooth; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; }
        a { text-decoration: none; color: inherit; }

        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background-color: white; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 1000; }
        .nav-logo { font-size: 1.2rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .nav-links { display: flex; gap: 15px; }
        .nav-links a { padding: 8px 16px; font-weight: 400; font-size: 0.95rem; border-radius: 3px; transition: 0.2s; }
        .nav-links a.active { background-color: var(--text-main); color: white; }
        .nav-links a:hover:not(.active) { background-color: #f0f0f0; }

        .section-container { max-width: 1000px; margin: 80px auto; padding: 0 40px; }
        .horizontal-title { text-align: center; font-size: 2.5rem; font-weight: 700; color: var(--heading-color); letter-spacing: 2px; margin-bottom: 60px; text-transform: uppercase; }
        
        .projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px; }
        
        .project-card { display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; background: var(--section-bg-gray); border: 1px solid var(--border-color); text-align: center; }
        .project-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-color: #ccc; }
        .project-img { width: 100%; height: 250px; object-fit: cover; background-color: #eeeeee; border-bottom: 1px solid var(--border-color); }
        .project-title { font-size: 1.2rem; font-weight: 600; padding: 20px 15px; color: var(--heading-color); }
        /* =========================================
           MOBILE RESPONSIVENESS FIXES
           ========================================= */
        @media (max-width: 768px) {
            /* 1. Fix the Navigation Bar */
            .navbar { flex-direction: column; padding: 15px 20px; gap: 15px; }
            .nav-links { flex-wrap: wrap; justify-content: center; gap: 10px; }
            .nav-links a { font-size: 0.85rem; padding: 6px 12px; }

            /* 2. Shrink Giant Fonts in Headers */
            .hero { padding: 80px 20px 60px; }
            .hero h1, .page-header h1, .project-title { font-size: 2.2rem; }
            .hero h2 { font-size: 1.2rem; }
            .horizontal-title { font-size: 2rem; margin-bottom: 30px; }

            /* 3. Stack Side-by-Side Content Vertically */
            .content-flex { flex-direction: column; align-items: center; gap: 30px; }
            .section-text { text-align: center; }
            .section-text p { text-align: left; } /* Keeps paragraphs readable */
            
            /* 4. Fix Images Blowing Out the Screen Width */
            .section-img, .side-images, .course-img { width: 100%; max-width: 350px; height: auto; }
            .main-img { height: auto; max-height: 300px; }
            
            /* 5. Fix Grids & Lists */
            .skills-grid { grid-template-columns: 1fr; gap: 20px; text-align: left; }
            .clean-item { flex-direction: column; gap: 8px; }
            .clean-item-right { text-align: left; margin-top: 5px; }
            .xp-header { flex-direction: column; gap: 5px; }
            
            /* 6. Adjust Spacing */
            .section-container, .project-container { padding: 40px 20px; margin: 40px auto; }
            .page-links { gap: 15px; margin: 40px 0; }
            .page-icon-card { width: 100%; max-width: 300px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">Aarav Jayswal</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="projects.html" class="active">Projects</a>
            <a href="resume.html">Resume</a>
            <a href="coursework.html">Coursework</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <div class="section-container">
        <h2 class="horizontal-title">Projects</h2>
        
        <div class="projects-grid">
            
            <a href="project-pid.html" class="project-card">
                <img src="Pid1.png" alt="PID Controller" class="project-img">
                <div class="project-title">PID Temperature Controller & Custom Power Supply</div>
            </a>


            <a href="project_temp.html" class="project-card">
                <img src="temp1.png" alt="Temperature Monitor Circuit" class="project-img">
                <div class="project-title">Temperature Monitoring System</div>
            </a>

            <a href="project-decade.html" class="project-card">
                <img src="decade.png" alt="Decade Counter PCB" class="project-img">
                <div class="project-title">Decade Counter Display</div>
            </a>

            <a href="project-robot.html" class="project-card">
                <img src="robot.jpg" alt="Line Following Robot" class="project-img">
                <div class="project-title">Line Following Robot</div>
            </a>





        </div>
    </div>

</body>
</html>
